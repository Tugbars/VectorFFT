<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340">
  <rect width="1200" height="340" fill="#F1F4F7"/>
  <!-- machined top edge -->
  <line x1="0" y1="0.5" x2="1200" y2="0.5" stroke="#FFFFFF" stroke-width="1"/>

  <!-- wordmark -->
  <text x="86" y="124" font-family="IBM Plex Sans Condensed" font-weight="700" font-size="82"
        letter-spacing="-2.2" fill="#0C1317">VectorFFT</text>
  <text x="88" y="157" font-family="IBM Plex Mono" font-weight="400" font-size="14.5"
        letter-spacing="0.5" fill="#586878" xml:space="preserve">double-precision FFT  ·  x86-64  ·  AVX2 / AVX-512</text>

  <!-- engine nameplate -->
  <g font-family="IBM Plex Mono" font-weight="400" font-size="11.5" letter-spacing="1.15"
     fill="#7E8D9A" text-anchor="end">
    <text x="1112" y="74">DAG CODELET COMPILER</text>
    <text x="1112" y="96">SELF-CALIBRATING PLAN SEARCH</text>
  </g>

  <line x1="88" y1="190.5" x2="1112" y2="190.5" stroke="#D2DAE1" stroke-width="1"/>
  <line x1="350.5" y1="204" x2="350.5" y2="272" stroke="#DBE2E7" stroke-width="1"/>
  <line x1="850.5" y1="204" x2="850.5" y2="272" stroke="#DBE2E7" stroke-width="1"/>

  <!-- measurement band -->
  <g font-family="IBM Plex Mono" font-weight="500" font-size="10.5" letter-spacing="1.9" fill="#586878" xml:space="preserve">
    <text x="88" y="225" text-anchor="start">VS FFTW</text>
    <text x="600" y="225" text-anchor="middle">VS INTEL MKL   ·   198/198 WINS</text>
    <text x="1112" y="225" text-anchor="end">VS INTEL MKL   ·   8 THREADS</text>
  </g>
  <g font-family="IBM Plex Mono" font-weight="600" font-size="47" letter-spacing="-1.2" fill="#0C1317">
    <text x="88" y="272" text-anchor="start">2<tspan fill="#7E8D9A">–</tspan>12<tspan fill="#7E8D9A">×</tspan></text>
    <text x="600" y="272" text-anchor="middle">1<tspan fill="#7E8D9A">–</tspan>9.8<tspan fill="#7E8D9A">×</tspan></text>
    <text x="1112" y="272" text-anchor="end">5<tspan fill="#7E8D9A">–</tspan>13<tspan fill="#7E8D9A">×</tspan></text>
  </g>

  <line x1="88" y1="300.5" x2="1112" y2="300.5" stroke="#D2DAE1" stroke-width="1"/>
  <text x="88" y="324" font-family="IBM Plex Mono" font-weight="400" font-size="12"
        letter-spacing="0.7" fill="#7E8D9A" xml:space="preserve">C2C · R2C · C2R · DCT · DST · DHT     1D–4D     AoS &amp; SoA     in-place &amp; out-of-place     multithreaded     MIT</text>
</svg>
