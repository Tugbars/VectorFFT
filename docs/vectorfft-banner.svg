    <rect x="970" y="96"  width="6" height="154"/>
    <rect x="1042" y="102" width="6" height="148"/>
  </g>

  <!-- wordmark -->
  <text x="86" y="122" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="76" font-weight="700" letter-spacing="-1" fill="#0f172a">VectorFFT</text>
  <text x="90" y="164" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" font-size="22" fill="#64748b">Split-complex FFT for x86  ·  AVX2 / AVX-512</text>

  <!-- headline: measured speedups -->
  <text x="90"  y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#2563eb">2&#8211;12&#215;</text>
  <text x="90"  y="266" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#64748b">over FFTW</text>

  <text x="300" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#2563eb">1&#8211;9.8&#215;</text>
  <text x="300" y="266" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#64748b">over Intel MKL  ·  198/198 benchmarks</text>

  <text x="640" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="40" font-weight="700" fill="#2563eb">5&#8211;13&#215;</text>
  <text x="640" y="266" font-family="system-ui, 'Segoe UI', sans-serif" font-size="16" fill="#64748b">over MKL  ·  8 threads</text>

  <!-- what's under the hood + coverage -->
  <line x1="90" y1="298" x2="1132" y2="298" stroke="#eef2f7" stroke-width="1"/>
  <text x="90" y="322" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" fill="#94a3b8">DAG codelet compiler  ·  self-calibrating plan search  ·  19 tuned radixes  ·  FP64 split re/im</text>
  <text x="90" y="345" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14.5" fill="#94a3b8">C2C  ·  R2C / C2R  ·  DCT / DST / DHT  ·  1D &amp; 2D  ·  in-place &amp; out-of-place  ·  multithreaded  ·  MIT</text>
</svg>
