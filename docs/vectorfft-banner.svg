  <rect x="0" y="0" width="6" height="360" fill="#2563eb"/>

  <!-- subtle frequency-spectrum motif, right side -->
  <g fill="#dbe7fb">
    <rect x="946" y="118" width="6" height="132"/>
    <rect x="958" y="160" width="6" height="90"/>
    <rect x="970" y="96"  width="6" height="154"/>
    <rect x="982" y="146" width="6" height="104"/>
    <rect x="994" y="70"  width="6" height="180"/>
    <rect x="1006" y="150" width="6" height="100"/>
    <rect x="1018" y="118" width="6" height="132"/>
    <rect x="1030" y="176" width="6" height="74"/>
    <rect x="1042" y="102" width="6" height="148"/>
    <rect x="1054" y="158" width="6" height="92"/>
    <rect x="1066" y="130" width="6" height="120"/>
    <rect x="1078" y="184" width="6" height="66"/>
    <rect x="1090" y="150" width="6" height="100"/>
